name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Copiar la web a www
        run: mkdir -p www && cp index.html manifest.json sw.js icon.svg www/
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Permisos de notificaciones y alarmas
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application#' $M
          grep -c "SCHEDULE_EXACT_ALARM" $M
      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mi-Horario-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
